frr version 10.0
frr defaults traditional
hostname player
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
ip prefix-list PLAYER-ROUTES seq 5 permit 10.0.5.0/24
ip prefix-list PLAYER-ROUTES seq 100 permit 10.0.0.0/8 le 24
ip prefix-list HIJACK-ALL seq 1 permit 10.0.1.0/24
ip prefix-list HIJACK-ALL seq 2 permit 10.0.2.0/24
ip prefix-list HIJACK-WALLET seq 1 permit 10.0.2.0/24
ip route 10.0.6.0/24 10.100.35.1
!
! These two routes were ADDED during the exploit to originate the hijack.
! Without them the `network 10.0.1.0/24` / `network 10.0.2.0/24` statements
! below are inactive because no matching kernel route exists.
ip route 10.0.1.0/24 10.0.5.100
ip route 10.0.2.0/24 10.0.5.100
!
route-map EXPORT-REGIONAL permit 5
 match ip address prefix-list HIJACK-WALLET
exit
!
route-map EXPORT-REGIONAL permit 10
 match ip address prefix-list PLAYER-ROUTES
exit
!
route-map EXPORT-IXP permit 5
 match ip address prefix-list HIJACK-ALL
exit
!
route-map EXPORT-IXP permit 10
 match ip address prefix-list PLAYER-ROUTES
exit
!
router bgp 64505
 bgp router-id 5.5.5.5
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 10.100.35.1 remote-as 64503
 neighbor 10.100.35.1 description regionallink
 neighbor 10.100.45.1 remote-as 64504
 neighbor 10.100.45.1 description ixp
 !
 address-family ipv4 unicast
  network 10.0.1.0/24
  network 10.0.2.0/24
  network 10.0.5.0/24
  neighbor 10.100.35.1 route-map EXPORT-REGIONAL out
  neighbor 10.100.45.1 route-map EXPORT-IXP out
 exit-address-family
exit
